name: Web dashboard build

on:
  push:
    branches: [feature/web-research-dashboard]
    paths:
      - "web/**"
      - ".github/workflows/web-dashboard.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-dashboard.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python simulator and test dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Python test suite
        working-directory: .
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
