name: Python tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,demo]"
      - name: Compile package and tests
        run: python -m compileall -q src tests
      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
      - name: Run pytest suite
        run: python -m pytest
      - name: Smoke test baseline benchmark CLI
        run: |
          python -m autodrive_sim.benchmark --episodes 2 --output /tmp/baseline.json --telemetry-dir /tmp/autodrive-telemetry
          python -c "import json; from pathlib import Path; report=json.loads(Path('/tmp/baseline.json').read_text()); assert report['episode_count'] == 2; assert len(list(Path('/tmp/autodrive-telemetry').glob('*.csv'))) == 2"
