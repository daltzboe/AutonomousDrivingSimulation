[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodrive-simulation"
version = "0.2.0"
description = "Lightweight autonomous-driving research simulator with a CARLA integration path"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
demo = ["pygame>=2.5"]

[project.scripts]
autodrive-demo = "autodrive_sim.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
